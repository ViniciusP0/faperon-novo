name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: faperon
          POSTGRES_USER: faperon
          POSTGRES_PASSWORD: faperon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faperon" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: faperon
      POSTGRES_USER: faperon
      POSTGRES_PASSWORD: faperon
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      # Roda no checkout, fora do container (lá o .env.example não existe): limites documentados, chave nunca.
      - name: .env.example documenta o Zétele sem a chave
        run: |
          set -eu
          falhou=0
          for segredo in ANTHROPIC_API_KEY GROQ_API_KEY GEMINI_API_KEY; do
            if grep -q "^${segredo}=" .env.example; then
              echo "::error file=.env.example::${segredo} não pode estar no .env.example (fica no .env.local)"
              falhou=1
            fi
          done
          for nome in ZETELE_RATE_LIMIT ZETELE_GLOBAL_RATE_LIMIT ZETELE_LIMITE_DIARIO ZETELE_SIMULTANEOS ZETELE_VOZ_RATE_LIMIT ZETELE_VOZ_GLOBAL_RATE_LIMIT; do
            if ! grep -q "^${nome}=" .env.example; then
              echo "::error file=.env.example::falta ${nome}= no .env.example"
              falhou=1
            fi
          done
          exit "$falhou"
      - name: Build da imagem da API
        run: docker build --target dev -t faperon-api apps/api
      - name: Build do estágio de produção da API
        run: docker build --target prod -t faperon-api-prod apps/api
      - name: Ruff
        run: docker run --rm faperon-api ruff check .
      - name: mypy
        run: docker run --rm -e DJANGO_SECRET_KEY faperon-api mypy .
      - name: Migrações (verificação) e testes
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e DJANGO_SECRET_KEY \
            faperon-api sh -c "python manage.py makemigrations --check --dry-run && pytest"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
