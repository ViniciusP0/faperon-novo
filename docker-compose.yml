name: faperon

x-api: &api
  build: ./apps/api
  env_file: .env
  environment:
    POSTGRES_HOST: db
  volumes:
    - ./data:/app/data
  restart: always
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faperon}
      POSTGRES_USER: ${POSTGRES_USER:-faperon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faperon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faperon} -d ${POSTGRES_DB:-faperon}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  api:
    <<: *api
    command: ["/app/entrypoint.sh", "web"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/saude')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  scheduler:
    <<: *api
    command: ["/app/entrypoint.sh", "scheduler"]
    depends_on:
      api:
        condition: service_healthy

  api-dev:
    <<: *api
    build:
      context: ./apps/api
      target: dev
    profiles: ["dev"]
    restart: "no"

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
