name: faperon

x-api: &api
  build:
    context: ./apps/api
    target: prod
  # .env.local guarda segredos (ANTHROPIC_API_KEY); opcional, fora do git. Exige Compose >= 2.24.
  env_file:
    - path: .env
    - path: .env.local
      required: false
  environment:
    POSTGRES_HOST: db
  volumes:
    - ./data:/app/data
  restart: always
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faperon}
      POSTGRES_USER: ${POSTGRES_USER:-faperon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faperon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faperon} -d ${POSTGRES_DB:-faperon}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  api:
    <<: *api
    command: ["/app/entrypoint.sh", "web"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/saude')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  scheduler:
    <<: *api
    command: ["/app/entrypoint.sh", "scheduler"]
    depends_on:
      api:
        condition: service_healthy

  api-dev:
    <<: *api
    build:
      context: ./apps/api
      target: dev
    profiles: ["dev"]
    restart: "no"

  web:
    build:
      context: ./apps/web
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      api:
        condition: service_healthy

  # Recebe o webhook de push do GitHub (ADR 0021). Só cria infra/.deploy-pendente; quem atualiza e
  # reconstrói é o infra/deploy.ps1 no host. Funnel :10000 -> 127.0.0.1:9001.
  webhook:
    image: python:3.12-slim
    command: ["python", "/app/infra/webhook_listener.py"]
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      DEPLOY_MODE: gatilho
      LISTEN_HOST: 0.0.0.0
    volumes:
      - ./infra:/app/infra
    ports:
      - "127.0.0.1:9001:9001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: always

volumes:
  pgdata:
