[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "DJ001", "DJ008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"*/tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning", "ignore::DeprecationWarning:weasyprint.*"]
markers = ["golden: números de ouro conferidos no SIDRA"]

[tool.coverage.run]
source = ["indicadores", "analise", "ingestao"]
omit = ["*/migrations/*", "*/management/*", "*/tests/*"]
